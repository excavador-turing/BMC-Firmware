name: checks

# The image build takes two hours. These do not, and they guard the two things
# in this repository that can brick a board without the compiler noticing: the
# promotion gate, and the shell around it.
#
# Deliberately a separate workflow from build.yml so a change to a shell script
# gets an answer in under a minute instead of waiting on Buildroot.
on:
  workflow_dispatch:
  pull_request:
    branches: ["hive"]
  push:
    branches: ["hive"]
    tags: ["v*"]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: promotion gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The board runs busybox ash, not bash. A construct that works in the
      # runner's shell and not on the board would pass here and fail where it
      # matters, so run the suite under both: dash for POSIX strictness,
      # busybox ash for the actual target.
      #
      # The runner image ships third-party apt repositories this job has no
      # use for. On 2026-09-09 a hash mismatch in Google's failed the step,
      # so an unrelated repository took down the gate's own tests. Drop the
      # .list files, which is all of them -- Ubuntu's own archive is a
      # .sources file and stays.
      - name: install shells
        run: |
          sudo rm -f /etc/apt/sources.list.d/*.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq dash busybox

      - name: contract tests (dash)
        run: |
          dash tests/gate.sh
          dash tests/version.sh

      - name: contract tests (busybox ash, as on the board)
        run: |
          busybox ash tests/gate.sh
          busybox ash tests/version.sh

      # The gate is only as good as its ability to say no. If a mutation that
      # removes a rejection still passes the suite, the suite is decorative.
      - name: the suites must catch a gate that cannot reject
        run: |
          set -eu
          gate=tp2bmc/board/tp2bmc/overlay/etc/init.d/S99postupdate
          updater=tp2bmc/board/tp2bmc/overlay/sbin/tpi-selfupdate
          cp "$gate" /tmp/gate.orig
          cp "$updater" /tmp/updater.orig
          trap 'cp /tmp/gate.orig "$gate"; cp /tmp/updater.orig "$updater"' EXIT

          fails=0
          mutate() {
            cp /tmp/gate.orig "$gate"
            sed -i "$1" "$gate"
            if dash tests/gate.sh >/dev/null 2>&1; then
              echo "NOT CAUGHT: $2"
              fails=$((fails + 1))
            else
              echo "caught: $2"
            fi
          }

          mutate 's|elif \[ "$staged" != "$running" \]; then|elif false; then|' \
                 'a version mismatch is never rejected'
          mutate 's|\t\t\*bmcd_build_info\*)|\t\t*)|' \
                 'any metrics body is accepted'

          # And the ordering. Dropping this one guard is exactly the old
          # behaviour: a release candidate compares as newer than its own
          # release, which is how the bug got in.
          cp /tmp/updater.orig "$updater"
          sed -i '/\[ -n "$run_pre" \] || return 1/d' "$updater"
          if dash tests/version.sh >/dev/null 2>&1; then
            echo "NOT CAUGHT: a candidate ranks above its own release"
            fails=$((fails + 1))
          else
            echo "caught: a candidate ranks above its own release"
          fi
          cp /tmp/updater.orig "$updater"

          [ "$fails" -eq 0 ]

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    env:
      # Pinned, and fetched rather than apt-installed: the distro package
      # lags, and `--shell=busybox` (below) needs a recent shellcheck.
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install shellcheck
        run: |
          set -eu
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ -C /tmp
          echo "/tmp/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # --shell=busybox, not dash. The board's shell is busybox ash built with
      # bash compat, so `${blockdev//block/}` in ubi_block_name is legal there
      # and has worked on every board this firmware has run on. Checked against
      # dash, that line is an error and the whole job would be red for a
      # construct that is correct on the target.
      #
      # Only the scripts this fork owns: the Buildroot tree carries thousands
      # of upstream scripts, and linting those reports other people's style
      # forever.
      - name: shellcheck the fork's scripts
        run: |
          set -eu
          shellcheck --shell=busybox --severity=warning \
            tests/gate.sh \
            tests/dashboard.sh \
            tests/pins-are-current.sh \
            tp2bmc/package/bmcd/generate_self_signedx509.sh \
            tp2bmc/board/tp2bmc/overlay/etc/init.d/S00sysrq \
            tp2bmc/board/tp2bmc/overlay/usr/sbin/mdnsd-guard \
            tp2bmc/board/tp2bmc/overlay/etc/init.d/S99postupdate \
            tp2bmc/board/tp2bmc/overlay/sbin/tpi-selfupdate \
            tp2bmc/board/tp2bmc/overlay/sbin/osupdate

  # A firmware release ships the LATEST bmcd, BMC-UI and tpi. Standing rule,
  # owner's, 2026-09-11. It is a check rather than a habit because every one of
  # these pins is a 64-character hash in a file nobody reads, and the cost of
  # forgetting is invisible: v2.22.0 shipped an interface one release behind
  # while nothing anywhere was red.
  #
  # Reports on a PR, refuses on a tag. Failing every PR because somebody
  # released a daemon an hour ago is how a check becomes something people learn
  # to ignore.
  # `pins` MOVED to build.yml on 2026-09-12, and the move is the point.
  #
  # It lived here, failed on the v2.26.0 tag exactly as designed -- tpi was a
  # release behind -- and the image was built and published anyway, six
  # minutes later, because this workflow and the one that publishes are two
  # runs of the same tag with no dependency between them. A red check here
  # could not stop anything.
  #
  # A rule about what a release contains has to be enforced by the workflow
  # that makes the release. It is a `needs:` of the build job now (SQU-203).

  # The board's own certificate is what protects the password typed into the
  # login page on the management LAN, and the script that issues it can, if it
  # gets the checks wrong, DELETE an operator's real certificate at boot. That
  # is not something to discover on hardware.
  selfsigned:
    name: self-signed certificate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: what the script must and must not do
        run: ./tests/selfsigned-cert.sh

  # The dashboard is published as a release asset, so a broken one is only
  # discovered by whoever downloads it -- after the release is immutable.
  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: validate the published dashboard
        run: sh tests/dashboard.sh
