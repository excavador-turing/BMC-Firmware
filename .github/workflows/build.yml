name: CI
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "info"
        type: choice
        options:
          - off
          - error
          - warn
          - info
          - debug
          - trace
      bmcd_version:
        description: "BMC daemon version"
        required: false
        type: string

  pull_request:
    branches: ["master"]
  push:
    branches:
      - "*"
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUST_LOG: ${{ inputs.logLevel }}

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-android: "true"

      - uses: actions/checkout@v4
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: get version
        run: |
          echo "BUILD_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: conditional bmcd version injection
        if: inputs.bmcd_version != ''
        run: |
          sed -ir 's#^BMCD_VERSION.*#BMCD_VERSION=${{ inputs.bmcd_version }}#g' ${{ github.workspace }}/tp2bmc/package/bmcd/bmcd.mk

      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: buildroot_local:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
        env:
          DOCKER_BUILD_SUMMARY: false

      - name: build firmware
        uses: addnab/docker-run-action@v3
        with:
          image: buildroot_local:latest
          options: -v ${{ github.workspace }}:/work
          run: |
            /work/scripts/configure.sh
            /work/scripts/build.sh --release ${{ env.BUILD_VERSION }}

      - name: stamp images
        run: |
          mv dist artifacts

      # `dist` is created INSIDE the build container as root, so after
      # `mv dist artifacts` the runner user cannot write into it:
      #   SHA256SUMS: Permission denied
      # Take ownership first. Checksum only the two images -- build.sh
      # already emits a per-file .sha256 next to each, and hashing those
      # would be hashing hashes.
      - name: checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts
          cd artifacts
          ls -la
          sha256sum *.tpu *.img > SHA256SUMS
          cat SHA256SUMS

      - name: archive artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: tp2-${{ env.BUILD_VERSION }}
          path: artifacts/*

      # Upstream stops at upload-artifact, which expires after 90 days. That
      # matters here: v2.1.0 was never mirrored to firmware.turingpi.com, so
      # the only published build of the firmware this estate runs exists as
      # assets on one GitHub release page, from a project whose owners have
      # gone quiet. Releases do not expire.
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body: |
            Turing Pi 2 BMC firmware, built from the `hive` branch.

            **Not a Turing Pi release.** Upstream is dormant: last release
            v2.1.0 (2025-02-05), last commit 2025-08-28, and the lead
            maintainer stated on 2026-06-16 that he has moved on.

            Includes the unmerged versioning fix (upstream PR #242), so
            `/etc/os-release` reports the actual firmware version instead of
            Buildroot's, and bmcd moves v2.3.4 -> v2.3.7.

            `.tpu` is the OTA package, `.img` the recovery SD image.
            Verify with `sha256sum -c SHA256SUMS`.
