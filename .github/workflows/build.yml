name: CI
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "info"
        type: choice
        options:
          - off
          - error
          - warn
          - info
          - debug
          - trace
      bmcd_version:
        description: "BMC daemon version"
        required: false
        type: string

  pull_request:
    branches: ["hive"]

  # `branches: ["*"]` built every push to every slash-less branch, and a tag
  # pushed right after its commit ran a SECOND identical two-hour build of
  # the same tree (runs 34062201851 and 34062204130, 2026-09-06). Build the
  # integration branch and release tags; a topic branch gets its build from
  # a pull request or workflow_dispatch.
  push:
    branches: ["hive"]
    tags: ["v*"]

# One build per commit: group by SHA, and let a tag run replace a branch run
# that is already building the same tree.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: ${{ github.ref_type == 'tag' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release step; nothing else writes
    env:
      RUST_LOG: ${{ inputs.logLevel }}

    # Actions are pinned by commit (the moving tag is in the comment):
    # a retagged action cannot change what runs with `contents: write`.
    #
    # "Maximize build space" is gone: it spent 58-65 s deleting Android
    # SDKs to free 11 GB on a runner that already had 86 GB free. The whole
    # build -- output, dl, ccache, image -- needs about 15 GB, and the
    # report step prints df so a shrinking runner gets noticed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: get version
        run: |
          echo "BUILD_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      - name: conditional bmcd version injection
        if: inputs.bmcd_version != ''
        run: |
          sed -ir 's#^BMCD_VERSION.*#BMCD_VERSION=${{ inputs.bmcd_version }}#g' ${{ github.workspace }}/tp2bmc/package/bmcd/bmcd.mk

      # Buildroot's dl/ tree (~0.8 GB): every source tarball plus the
      # cargo-vendored crates of bmcd, tpi and bmc_installer. Keyed on what
      # decides WHAT gets downloaded; restore-keys reuse the newest older
      # cache, so a new package costs only its own download.
      - name: restore Buildroot downloads
        id: dl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: br-dl-${{ hashFiles('scripts/configure.sh', 'buildroot_patches/*', 'tp2bmc/configs/tp2bmc_defconfig', 'tp2bmc/package/**') }}
          restore-keys: |
            br-dl-

      # ccache. BR2_CCACHE=y has been in the defconfig all along, but the
      # cache lived in the container's /root and died with it, so every run
      # compiled gcc, glibc and the kernel from nothing. The key is unique
      # per run so the post-build save always happens; restore-keys pick up
      # the newest one. CCACHE_MAXSIZE keeps it well inside the repository's
      # 10 GB cache quota (the docker layers take ~0.4 GB of it).
      - name: restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: br-ccache-${{ github.run_id }}
          restore-keys: |
            br-ccache-

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          tags: buildroot_local:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
        env:
          DOCKER_BUILD_SUMMARY: false

      # BR2_DL_DIR and BR2_CCACHE_DIR are the two Buildroot knobs that take
      # the ENVIRONMENT over .config (Makefile: "set this before including
      # .config"), so the defconfig stays exactly what developers use.
      # ccache stats are printed even when the build fails -- that is when
      # you want them.
      - name: build firmware
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: buildroot_local:latest
          options: >-
            -v ${{ github.workspace }}:/work
            -e BR2_DL_DIR=/work/dl
            -e BR2_CCACHE_DIR=/work/.ccache
            -e CCACHE_MAXSIZE=2G
            -e BUILD_VERSION=${{ env.BUILD_VERSION }}
          run: |
            set -e
            /work/scripts/configure.sh
            rc=0
            /work/scripts/build.sh --release "${BUILD_VERSION}" || rc=$?
            BR_CACHE_DIR=/work/.ccache /work/buildroot/output/host/bin/ccache -s \
              > /work/ccache-stats.txt 2>&1 || true
            exit $rc

      # The build runs as root inside the container, so dl/ and .ccache come
      # out root-owned; actions/cache tars them as the runner user and the
      # first cold run (34063520991) saved NOTHING for dl/ -- `tar: Cannot
      # open: Permission denied` on dl/br-cargo-home/... -- while reporting
      # the step green. Hand both trees back before saving.
      - name: make the caches readable by the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dl .ccache 2>/dev/null || true

      # Save both caches even when the build failed: the three failed runs
      # of 2026-09-06 each re-downloaded 0.7 GB and rebuilt the toolchain.
      - name: save Buildroot downloads
        if: always() && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: br-ccache-${{ github.run_id }}

      # Where the time went. build-time.log is what `make graph-build`
      # reads; its top in the step summary turns the next slow build into
      # a ten-second diagnosis instead of a 47 MB log download.
      - name: build report
        if: always()
        run: |
          {
            echo "### Build report"
            echo
            echo '```'
            df -h / | sed -n '1,2p'
            echo '```'
            log=buildroot/output/build/build-time.log
            if [ -f "$log" ]; then
              echo
              echo "Top 20 packages by wall time (seconds):"
              echo
              echo '```'
              # epoch:start|end:step: pkg  (fields are space-padded)
              awk -F: '
                { gsub(/ /, "", $2); gsub(/ /, "", $3); sub(/^ +/, "", $4) }
                $2 == "start" { s[$4 ":" $3] = $1 }
                $2 == "end"   { t[$4] += $1 - s[$4 ":" $3] }
                END { for (p in t) printf "%8.0f  %s\n", t[p], p }
              ' "$log" | sort -rn | head -20
              echo '```'
            fi
            if [ -s ccache-stats.txt ]; then
              echo
              echo 'ccache:'
              echo
              echo '```'
              cat ccache-stats.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: stamp images
        run: |
          mv dist artifacts

      # `dist` is created INSIDE the build container as root, so after
      # `mv dist artifacts` the runner user cannot write into it:
      #   SHA256SUMS: Permission denied
      # Take ownership first. Checksum only the two images -- build.sh
      # already emits a per-file .sha256 next to each, and hashing those
      # would be hashing hashes.
      - name: checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts
          cd artifacts
          ls -la
          sha256sum *.tpu *.img > SHA256SUMS
          cat SHA256SUMS

      - name: archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: tp2-${{ env.BUILD_VERSION }}
          path: artifacts/*

      # Upstream stops at upload-artifact, which expires after 90 days. That
      # matters here: v2.1.0 was never mirrored to firmware.turingpi.com, so
      # the only published build of the firmware this estate runs exists as
      # assets on one GitHub release page, from a project whose owners have
      # gone quiet. Releases do not expire.
      #
      # overwrite_files: false -- a re-run of a tag must not silently swap
      # the binary people already flashed (the build is not reproducible:
      # no BR2_REPRODUCIBLE, so timestamps and the root password salt
      # differ per build). To republish, delete the release first, on
      # purpose. A `-` in the tag (v2.2.0-unstable-hive.3) marks a
      # prerelease, so an unstable build is never "Latest".
      #
      # draft: true, then publish in a separate step. With GitHub's
      # immutable releases enabled, assets are locked the moment a release
      # is published; softprops uploads before publishing for standard
      # releases but leaves PRERELEASES published first (its README says
      # so), and every hive.N tag is a prerelease. A draft accepts assets,
      # and `gh release edit --draft=false` publishes it once they are all
      # there -- also atomic from a downloader's point of view.
      - name: release (draft, with assets)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body: |
            Turing Pi 2 BMC firmware, built from the `hive` branch.

            **Not a Turing Pi release.** Upstream is dormant: last release
            v2.1.0 (2025-02-05), last commit 2025-08-28, and the lead
            maintainer stated on 2026-06-16 that he has moved on.

            Includes the unmerged versioning fix (upstream PR #242), so
            `/etc/os-release` reports the actual firmware version instead of
            Buildroot's, and bmcd moves v2.3.4 -> v2.3.7.

            `.tpu` is the OTA package, `.img` the recovery SD image.
            Verify with `sha256sum -c SHA256SUMS`.

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
