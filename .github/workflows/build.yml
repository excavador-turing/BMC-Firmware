name: CI
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "info"
        type: choice
        options:
          - off
          - error
          - warn
          - info
          - debug
          - trace
      bmcd_version:
        description: "BMC daemon version"
        required: false
        type: string

  pull_request:
    branches: ["hive"]

  # `branches: ["*"]` built every push to every slash-less branch, and a tag
  # pushed right after its commit ran a SECOND identical two-hour build of
  # the same tree (runs 34062201851 and 34062204130, 2026-09-06). Build the
  # integration branch and release tags; a topic branch gets its build from
  # a pull request or workflow_dispatch.
  push:
    branches: ["hive"]
    tags: ["v*"]

# One build per commit: group by SHA, and let a tag run replace a branch run
# that is already building the same tree.
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: ${{ github.ref_type == 'tag' }}

permissions:
  contents: read

jobs:
  # CHANGELOG.md states the policy this enforces: "a two-hour Buildroot run for
  # a file that never reaches the board is waste." Until now that was a rule
  # nothing checked, and every push to `hive` cost two hours whether or not it
  # could change a byte of the image.
  #
  # Fails OPEN in every uncertain case -- a tag, a workflow_dispatch, a pull
  # request, a new branch, a force push, an unreadable diff -- because a build
  # that runs needlessly costs time, and one that is skipped wrongly ships an
  # untested image. Tags always build, so a release can never be skipped by
  # this, whatever it decides.
  gate:
    name: is a build needed
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          decide() {
            printf 'build=%s\n' "$1" >> "$GITHUB_OUTPUT"
            printf '%s: %s\n' "$1" "$2" >> "$GITHUB_STEP_SUMMARY"
            echo "$1: $2"
            exit 0
          }
          [ "${{ github.event_name }}" = "push" ] || decide true "not a push"
          case "${{ github.ref }}" in refs/tags/*) decide true "a tag always builds";; esac
          case "$BEFORE" in ""|0000000000000000000000000000000000000000)
            decide true "no previous commit to compare against";; esac
          changed=$(git diff --name-only "$BEFORE" "${{ github.sha }}") \
            || decide true "could not read the diff"
          [ -n "$changed" ] || decide true "empty diff"
          # Anything NOT matching these can change the image, so it builds.
          relevant=$(printf '%s\n' "$changed" | grep -vE \
            '^(dashboards/|tests/|\.github/workflows/checks\.yml$|.*\.md$|LICENSE$)' || true)
          if [ -z "$relevant" ]; then
            decide false "nothing changed that reaches the board"
          fi
          echo "these can change the image:"
          printf '  %s\n' $relevant
          decide true "$(printf '%s\n' "$relevant" | wc -l) path(s) reach the board"

  # The rule: a release ships the latest bmcd, BMC-UI and tpi.
  #
  # This job is where it is BECAUSE of where it is. The same check ran in
  # checks.yml until 2026-09-12, failed on the v2.26.0 tag, and the release
  # was published anyway -- two workflow runs of one tag, neither waiting on
  # the other, so the gate reported and could not refuse. A check that cannot
  # stop the thing it judges is decoration at the one moment it matters.
  #
  # The script reports on a pull request and exits non-zero only for a
  # `refs/tags/v*` ref, so this costs an ordinary push a few seconds and
  # blocks nothing that is not a release.
  pins:
    name: pins are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bmcd, BMC-UI and tpi are the latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./tests/pins-are-current.sh

  # The cross-toolchain, built once per change to it.
  #
  # Every run used to spend its first eleven minutes on binutils, gcc, glibc
  # and the kernel headers -- with a WARM ccache, since what is left is
  # extraction, configure and link -- and nothing target-side could start
  # until it was done. The toolchain changes a few times a year. So this job
  # hashes everything that decides what `make toolchain` produces
  # (scripts/toolchain-id.sh), and when no image exists for that hash, builds
  # the toolchain, packages it as a relocatable SDK (scripts/toolchain-sdk.sh)
  # and pushes ghcr.io/<owner>/bmc-toolchain:tc-<hash>. Every other run finds
  # the image and does nothing. The build job runs inside it, with a config
  # fragment that tells Buildroot where the compiler is
  # (docs/architecture.md, "The toolchain is built once per change to it").
  #
  # A pull request from ANOTHER repository has no token that can push a
  # package, so it skips this and the build job builds the toolchain itself,
  # as before. Nothing is silently different: the build report names which
  # it was.
  #
  # "Another repository" is spelled out as a name comparison, and not as
  # `head.repo.fork`, because THIS repository is a fork -- of
  # turing-machines/BMC-Firmware -- so `head.repo.fork` is true for every
  # pull request opened here, and the job skipped on all of them (measured
  # on #55's own runs, twice: first with `!(...)`, then with `!= true`).
  # The comparison is null-safe on a push, where there is no pull_request.
  toolchain:
    name: prebuilt toolchain image
    needs: gate
    if: >-
      needs.gate.outputs.build == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: name the image this toolchain would be
        id: name
        run: |
          id=$(sh scripts/toolchain-id.sh)
          echo "image=ghcr.io/${{ github.repository_owner }}/bmc-toolchain:tc-${id}" >> "$GITHUB_OUTPUT"
          echo "toolchain id: ${id}"

      - name: log in to the registry
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: does it exist already
        id: have
        run: |
          if docker manifest inspect "${{ steps.name.outputs.image }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "toolchain: ${{ steps.name.outputs.image }} exists; nothing to build" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "toolchain: ${{ steps.name.outputs.image }} does not exist; building it" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The same two caches the build uses, restore only: the sources of
      # gcc, glibc and binutils are in dl/, and ccache knows their objects.
      - name: restore Buildroot downloads
        if: steps.have.outputs.exists == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: br-dl-toolchain-${{ github.run_id }}
          restore-keys: |
            br-dl-

      - name: restore ccache
        if: steps.have.outputs.exists == 'false'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: br-ccache-toolchain-${{ github.run_id }}
          restore-keys: |
            br-ccache-

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.have.outputs.exists == 'false'
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: steps.have.outputs.exists == 'false'
        with:
          context: .
          tags: buildroot_local:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
        env:
          DOCKER_BUILD_SUMMARY: false

      - name: build the toolchain and package it
        if: steps.have.outputs.exists == 'false'
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: buildroot_local:latest
          options: >-
            -v ${{ github.workspace }}:/work
            -e BR2_DL_DIR=/work/dl
            -e BR2_CCACHE_DIR=/work/.ccache
            -e CCACHE_MAXSIZE=2G
          run: |
            set -e
            /work/scripts/configure.sh
            /work/scripts/toolchain-sdk.sh

      # Plain `docker build`, not buildx: the toolchain image is FROM the
      # image loaded above, which the buildx container driver cannot see.
      - name: push the toolchain image
        if: steps.have.outputs.exists == 'false'
        run: |
          docker build -f Dockerfile.toolchain --build-arg BASE=buildroot_local:latest \
            -t "${{ steps.name.outputs.image }}" .
          docker push "${{ steps.name.outputs.image }}"
          echo "pushed ${{ steps.name.outputs.image }}" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    # always(): `toolchain` is skipped for a fork's pull request, and a
    # skipped need would skip this job too. The conditions below say what
    # must actually hold.
    needs: [gate, pins, toolchain]
    if: >-
      always() &&
      needs.gate.outputs.build == 'true' &&
      needs.pins.result == 'success' &&
      (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the release step; nothing else writes
      packages: read    # the toolchain image
    env:
      # Empty when the toolchain job did not run (a fork's pull request);
      # then the build image is built here and the toolchain from source.
      TOOLCHAIN_IMAGE: ${{ needs.toolchain.outputs.image }}
      RUST_LOG: ${{ inputs.logLevel }}

    # Actions are pinned by commit (the moving tag is in the comment):
    # a retagged action cannot change what runs with `contents: write`.
    #
    # "Maximize build space" is gone: it spent 58-65 s deleting Android
    # SDKs to free 11 GB on a runner that already had 86 GB free. The whole
    # build -- output, dl, ccache, image -- needs about 15 GB, and the
    # report step prints df so a shrinking runner gets noticed.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
          fetch-tags: "true"

      - name: get version
        run: |
          echo "BUILD_VERSION=$(git describe --tags --always)" >> $GITHUB_ENV

      # What `cargo vendor` will run under: the Buildroot release names the
      # rust-bin version, and a patch to Buildroot could change it. Anything
      # else in the key (the defconfig, a package bump) does not touch the
      # vendored bytes.
      - name: name the Rust toolchain the vendored archives depend on
        run: |
          ver=$(sed -n 's/^BUILDROOT_VER="\(.*\)"$/\1/p' scripts/configure.sh)
          patches=$(cat buildroot_patches/* 2>/dev/null | sha256sum | cut -c1-12)
          echo "VENDORED_UNDER=buildroot-${ver}+patches-${patches}" >> $GITHUB_ENV

      - name: conditional bmcd version injection
        if: inputs.bmcd_version != ''
        run: |
          sed -ir 's#^BMCD_VERSION.*#BMCD_VERSION=${{ inputs.bmcd_version }}#g' ${{ github.workspace }}/tp2bmc/package/bmcd/bmcd.mk

      # Buildroot's dl/ tree (~0.8 GB): every source tarball plus the
      # cargo-vendored crates of bmcd, tpi and bmc_installer. Keyed on what
      # decides WHAT gets downloaded; restore-keys reuse the newest older
      # cache, so a new package costs only its own download.
      - name: restore Buildroot downloads
        id: dl
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: br-dl-${{ hashFiles('scripts/configure.sh', 'buildroot_patches/*', 'tp2bmc/configs/tp2bmc_defconfig', 'tp2bmc/package/**') }}
          restore-keys: |
            br-dl-

      # The cargo-vendored archives are the one thing in dl/ whose NAME does
      # not pin its CONTENTS. `bmcd-<commit>-cargo2.tar.gz` is named for the
      # package commit, but `cargo vendor` runs under the Rust toolchain, so a
      # Rust bump changes the bytes and keeps the filename. It broke a release
      # once: the primary key missed, restore-keys handed back the previous
      # cache, Buildroot found an archive with the right name and the wrong
      # contents, and every Rust package failed its hash check reporting the
      # PREVIOUS release's sum as what it "got".
      #
      # The first fix dropped the archives on EVERY fallback restore. That was
      # safe and too broad: a tag run can only see caches from the default
      # branch (GitHub's rule), and the push-to-hive run that would refresh
      # that scope is cancelled by the tag's concurrency group, so every
      # release run fell back, re-vendored three crates from crates.io, and
      # re-saved 2.3 GB -- one to two minutes and a network dependency at
      # exactly the moment nobody wants one, for a Rust toolchain that had
      # not moved.
      #
      # So the cache now carries a note of the toolchain it was vendored
      # under: the Buildroot release (which pins rust-bin) and the patches
      # applied to it (which could change that pin). The archives are dropped
      # only when the note disagrees with this checkout. A cache with no note
      # is treated as disagreeing, so the first run after this change still
      # re-vendors once.
      - name: drop the vendored archives if the Rust toolchain moved
        if: steps.dl.outputs.cache-hit != 'true'
        run: |
          have=$(cat dl/.vendored-under 2>/dev/null || echo "none")
          want="$VENDORED_UNDER"
          echo "cache vendored under: $have"
          echo "this checkout:        $want"
          if [ "$have" = "$want" ]; then
            echo "same toolchain; the vendored archives are kept"
          elif compgen -G 'dl/*-cargo2.tar.gz' > /dev/null; then
            echo "different toolchain; re-vendoring these:"
            ls -1 dl/*-cargo2.tar.gz
            rm -f dl/*-cargo2.tar.gz
          else
            echo "no vendored archives in the restored cache; nothing to drop"
          fi

      # ccache. BR2_CCACHE=y has been in the defconfig all along, but the
      # cache lived in the container's /root and died with it, so every run
      # compiled gcc, glibc and the kernel from nothing. The key is unique
      # per run so the post-build save always happens; restore-keys pick up
      # the newest one. CCACHE_MAXSIZE keeps it well inside the repository's
      # 10 GB cache quota (the docker layers take ~0.4 GB of it).
      - name: restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: br-ccache-${{ github.run_id }}
          restore-keys: |
            br-ccache-

      # sccache, the same shape as ccache above: a per-run key so the save
      # always happens, restore-keys to pick up the newest. This is what
      # covers the Rust packages, which ccache never sees. ~320 MB.
      - name: restore sccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: br-sccache-${{ github.run_id }}
          restore-keys: |
            br-sccache-

      # The toolchain image carries the build image, so with one there is
      # nothing to build here; without one (a fork's pull request) the
      # build image is built as it always was.
      - name: pull the toolchain image
        if: env.TOOLCHAIN_IMAGE != ''
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$TOOLCHAIN_IMAGE"
          docker tag "$TOOLCHAIN_IMAGE" buildroot_local:latest

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: env.TOOLCHAIN_IMAGE == ''
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: env.TOOLCHAIN_IMAGE == ''
        with:
          context: .
          tags: buildroot_local:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
        env:
          DOCKER_BUILD_SUMMARY: false

      # BR2_DL_DIR and BR2_CCACHE_DIR are the two Buildroot knobs that take
      # the ENVIRONMENT over .config (Makefile: "set this before including
      # .config"), so the defconfig stays exactly what developers use.
      # TP2BMC_CONFIG_FRAGMENT is build.sh's own knob: set, the CI fragment
      # is appended after the defconfig and Buildroot takes the compiler
      # from /opt/sdk in the toolchain image; empty, the toolchain is built
      # from source. ccache stats are printed even when the build fails --
      # that is when you want them.
      - name: build firmware
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185 # v3
        with:
          image: buildroot_local:latest
          options: >-
            -v ${{ github.workspace }}:/work
            -e BR2_DL_DIR=/work/dl
            -e BR2_CCACHE_DIR=/work/.ccache
            -e TP2BMC_CONFIG_FRAGMENT=${{ env.TOOLCHAIN_IMAGE && '/work/tp2bmc/configs/ci-external-toolchain.fragment' || '' }}
            -e CCACHE_MAXSIZE=2G
            -e RUSTC_WRAPPER=/usr/local/bin/sccache
            -e SCCACHE_DIR=/work/.sccache
            -e SCCACHE_CACHE_SIZE=1G
            -e BUILD_VERSION=${{ env.BUILD_VERSION }}
          run: |
            set -e
            /work/scripts/configure.sh
            rc=0
            /work/scripts/build.sh --release "${BUILD_VERSION}" || rc=$?
            BR_CACHE_DIR=/work/.ccache /work/buildroot/output/host/bin/ccache -s \
              > /work/ccache-stats.txt 2>&1 || true
            # In the log as well as the summary: the summary is not readable
            # by any API, and the hit rate is what says whether this works.
            sccache --show-stats > /work/sccache-stats.txt 2>&1 || true
            echo "--- sccache:"; cat /work/sccache-stats.txt
            sccache --stop-server > /dev/null 2>&1 || true
            exit $rc

      # The build runs as root inside the container, so dl/ and .ccache come
      # out root-owned; actions/cache tars them as the runner user and the
      # first cold run (34063520991) saved NOTHING for dl/ -- `tar: Cannot
      # open: Permission denied` on dl/br-cargo-home/... -- while reporting
      # the step green. Hand both trees back before saving.
      - name: make the caches readable by the runner
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dl .ccache .sccache 2>/dev/null || true

      - name: note which Rust toolchain this dl/ was vendored under
        if: always()
        run: echo "$VENDORED_UNDER" > dl/.vendored-under

      # Save both caches even when the build failed: the three failed runs
      # of 2026-09-06 each re-downloaded 0.7 GB and rebuilt the toolchain.
      - name: save Buildroot downloads
        if: always() && steps.dl.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dl
          key: ${{ steps.dl.outputs.cache-primary-key }}

      - name: save ccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: br-ccache-${{ github.run_id }}

      - name: save sccache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: br-sccache-${{ github.run_id }}

      # Where the time went. build-time.log is what `make graph-build`
      # reads; its top in the step summary turns the next slow build into
      # a ten-second diagnosis instead of a 47 MB log download.
      - name: build report
        if: always()
        run: |
          {
            echo "### Build report"
            echo
            echo '```'
            df -h / | sed -n '1,2p'
            echo '```'
            echo
            if [ -n "$TOOLCHAIN_IMAGE" ]; then
              echo "toolchain: prebuilt, $TOOLCHAIN_IMAGE"
            else
              echo "toolchain: built from source in this run"
            fi
            log=buildroot/output/build/build-time.log
            if [ -f "$log" ]; then
              echo
              echo "Top 20 packages by wall time (seconds):"
              echo
              echo '```'
              # epoch:start|end:step: pkg  (fields are space-padded)
              awk -F: '
                { gsub(/ /, "", $2); gsub(/ /, "", $3); sub(/^ +/, "", $4) }
                $2 == "start" { s[$4 ":" $3] = $1 }
                $2 == "end"   { t[$4] += $1 - s[$4 ":" $3] }
                END { for (p in t) printf "%8.0f  %s\n", t[p], p }
              ' "$log" | sort -rn | head -20
              echo '```'
            fi
            if [ -s ccache-stats.txt ]; then
              echo
              echo 'ccache:'
              echo
              echo '```'
              cat ccache-stats.txt
              echo '```'
            fi
            if [ -s sccache-stats.txt ]; then
              echo
              echo 'sccache (rustc):'
              echo
              echo '```'
              cat sccache-stats.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: stamp images
        run: |
          mv dist artifacts

      # `dist` is created INSIDE the build container as root, so after
      # `mv dist artifacts` the runner user cannot write into it:
      #   SHA256SUMS: Permission denied
      # Take ownership first. Checksum only the two images -- build.sh
      # already emits a per-file .sha256 next to each, and hashing those
      # would be hashing hashes.
      - name: checksums
        run: |
          sudo chown -R "$(id -u):$(id -g)" artifacts
          # The dashboard reads metrics this firmware's daemon emits, so it is
          # versioned with the firmware rather than left to drift on a website.
          # tests/dashboard.sh (checks.yml) has already validated it.
          cp dashboards/turingpi-bmc.json artifacts/turingpi-bmc-dashboard.json
          cd artifacts
          ls -la
          sha256sum *.tpu *.img turingpi-bmc-dashboard.json > SHA256SUMS
          cat SHA256SUMS

      - name: archive artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: tp2-${{ env.BUILD_VERSION }}
          path: artifacts/*

      # Upstream stops at upload-artifact, which expires after 90 days. That
      # matters here: v2.1.0 was never mirrored to firmware.turingpi.com, so
      # the only published build of the firmware this estate runs exists as
      # assets on one GitHub release page, from a project whose owners have
      # gone quiet. Releases do not expire.
      #
      # overwrite_files: false -- a re-run of a tag must not silently swap
      # the binary people already flashed (the build is not reproducible:
      # no BR2_REPRODUCIBLE, so timestamps and the root password salt
      # differ per build). To republish, delete the release first, on
      # purpose. A `-` in the tag (v2.2.0-unstable-hive.3) marks a
      # prerelease, so an unstable build is never "Latest".
      #
      # draft: true, then publish in a separate step. With GitHub's
      # immutable releases enabled, assets are locked the moment a release
      # is published; softprops uploads before publishing for standard
      # releases but leaves PRERELEASES published first (its README says
      # so), and every hive.N tag is a prerelease. A draft accepts assets,
      # and `gh release edit --draft=false` publishes it once they are all
      # there -- also atomic from a downloader's point of view.
      # The notes are composed from CHANGELOG.md, which is where the story of
      # a release is actually written. Until now the body was a fixed
      # paragraph in this file: v2.28.0 and v2.32.0, four days and fourteen
      # entries apart, published byte-identical notes, and both linked
      # turing.excavador.xyz, which has answered 502 since the docs moved.
      #
      # It runs BEFORE the release step so a standard tag with no changelog
      # section fails here, with nothing published, rather than after the
      # assets are up.
      - name: compose the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release-notes.py "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"

      - name: release (draft, with assets)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: false
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: ${{ runner.temp }}/notes.md

      - name: publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
