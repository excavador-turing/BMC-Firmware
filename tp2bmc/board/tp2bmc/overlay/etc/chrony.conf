# The public pool, as shipped. Kept as the fallback rather than the only
# source: the RTC covers boot, so this is not about correctness at power-on.
# It is about the one time somebody is standing at the board -- a WAN outage --
# when this is the only source and the clock quietly stops being disciplined.
pool pool.ntp.org iburst

# Servers configured through the API or the Settings tab land here, and the
# first of them is written with chrony's `prefer`. The directory is on the
# overlay so the setting survives a firmware upgrade, and `chronyc reload
# sources` picks up a change without restarting chronyd or losing the
# discipline it has built up.
#
# This line and bmcd's SOURCE_DIR must name the same directory. If they ever
# disagree, a saved list is written and silently never read -- so bmcd reports
# `configurable: false` when this line is missing, rather than offering a
# setting that does nothing.
#
# The directory is created by bmcd, which starts at S94 -- after chronyd at
# S49. On a board that has never had a server list set, chronyd therefore logs
# one "could not open directory" at boot and carries on with the pool above.
# It cannot be shipped in the image instead: /mnt/overlay is a mount point, so
# anything the rootfs holds under it is hidden the moment the real volume
# mounts.
sourcedir /mnt/overlay/chrony.d

makestep 0.1 5
rtcsync
